# Render Blueprint: the Express API and its PostgreSQL database.
# The React frontend is deployed separately on Vercel (see vercel.json),
# which proxies /api/* to this service so auth cookies stay first-party.
#
# Secrets are never stored here: JWT/CSRF secrets are generated by Render,
# DATABASE_URL comes from the database below, and the AI keys (sync: false)
# are entered in the Render dashboard when the Blueprint is created.

services:
  - type: web
    name: scriptly-api-mlh
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Migrations and the verified DRAP catalogue import are both idempotent.
    startCommand: npx prisma migrate deploy && npm run catalogue:import -- data/drap-verified-2026-10-29.csv --apply && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scriptly-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        value: https://scriptly-mlh.vercel.app
      - key: AI_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-3.5-flash
      - key: AI_FALLBACK_PROVIDER
        value: anthropic
      # Keep a whole read (retries + fallback) inside Vercel's proxy timeout.
      - key: VISION_TIMEOUT_MS
        value: "40000"
      - key: VISION_MAX_ATTEMPTS
        value: "2"
      - key: EMAIL_PROVIDER
        value: none
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: scriptly-db
    plan: free
    region: singapore
    databaseName: scriptly
    user: scriptly
    postgresMajorVersion: "16"
